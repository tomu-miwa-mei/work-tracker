<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="業務記録">
<meta name="theme-color" content="#EEF0F3">
<title>業務記録</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: #EEF0F3;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    color: #2A2E35;
    -webkit-user-select: none; user-select: none;
  }
  input { -webkit-user-select: text; user-select: text; }
  button { font-family: inherit; }
  .container {
    max-width: 440px; margin: 0 auto;
    padding: 16px 16px calc(40px + env(safe-area-inset-bottom));
    padding-top: calc(16px + env(safe-area-inset-top));
  }
  .appHeader { text-align: center; font-size: 18px; font-weight: 700; padding: 8px 0 14px; }

  /* 記録中カード */
  .statusCard {
    border-radius: 20px; border: 2px solid #E3E5E8; background: #F7F8FA;
    padding: 30px 18px; margin-bottom: 16px; text-align: center;
    transition: background .25s ease, border-color .25s ease;
  }
  .statusNowLabel { font-size: 15px; font-weight: 600; color: rgba(255,255,255,.9); margin-bottom: 10px; }
  .statusRow { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 8px; }
  .statusRow svg { width: 26px; height: 26px; }
  .statusLabel { font-size: 26px; font-weight: 800; color: #fff; }
  .statusTimer { font-size: 52px; font-weight: 800; letter-spacing: 1px; line-height: 1.1; color: #fff; font-variant-numeric: tabular-nums; }
  .idleWrap { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 6px 0; }
  .idleWrap svg { width: 30px; height: 30px; color: #B8BEC6; }
  .idleText { font-size: 17px; color: #9AA1AA; font-weight: 600; }

  /* 記録中カードのメモ */
  .activeMemoToggle {
    margin-top: 14px; background: rgba(255,255,255,.2); color: #fff;
    border: 1.5px solid rgba(255,255,255,.6); border-radius: 12px;
    padding: 8px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
    max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .activeMemoBox { margin-top: 14px; background: rgba(255,255,255,.15); border-radius: 14px; padding: 12px; text-align: left; }
  .memoQuickRow { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .activeMemoChip {
    font-size: 13px; font-weight: 600; color: #fff; background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.5); border-radius: 16px; padding: 5px 12px; cursor: pointer;
  }
  .activeMemoChip.on { background: #fff !important; border-color: #fff !important; }
  .memoInput {
    width: 100%; font-size: 16px; padding: 9px 12px; border-radius: 10px;
    border: 1px solid #E3E5E8; outline: none; background: #fff; color: #2A2E35;
  }
  .memoActions { display: flex; gap: 8px; margin-top: 8px; }
  .activeMemoClear {
    font-size: 13px; font-weight: 600; color: #fff; background: rgba(255,255,255,.15);
    border: 1px solid rgba(255,255,255,.5); border-radius: 10px; padding: 8px 14px; cursor: pointer;
  }
  .memoDone { flex: 1; font-size: 14px; font-weight: 700; color: #fff; border: none; border-radius: 10px; padding: 8px 14px; cursor: pointer; background: #fff; }

  /* 業務ボタン */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .gridSmall { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .taskBtn {
    border-radius: 16px; border: 2px solid; background: #fff;
    padding: 20px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; cursor: pointer; min-height: 104px; transition: all .18s ease;
  }
  .taskBtn.small { padding: 14px 10px; min-height: 62px; flex-direction: row; gap: 8px; }
  .taskBtn svg { width: 38px; height: 38px; }
  .taskBtn.small svg { width: 30px; height: 30px; }
  .taskLabel { font-size: 15px; font-weight: 700; text-align: center; line-height: 1.35; }
  .taskBtn.small .taskLabel { font-size: 14px; }

  /* 日付ナビ */
  .dateNav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .navBtn { width: 42px; height: 42px; border-radius: 12px; border: 1px solid #E3E5E8; background: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .navBtn svg { width: 20px; height: 20px; color: #6B7280; }
  .dateCenter { display: flex; align-items: center; gap: 8px; }
  .dateCenter svg { width: 17px; height: 17px; color: #6B7280; }
  .dateText { font-size: 18px; font-weight: 700; }
  .todayBadge { font-size: 12px; font-weight: 700; color: #3B7DD8; background: rgba(59,125,216,.1); padding: 3px 8px; border-radius: 8px; }

  /* 合計 */
  .totalCard { background: #fff; border-radius: 18px; padding: 18px 16px; margin-bottom: 16px; }
  .totalHead { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .totalHead svg { width: 19px; height: 19px; color: #3A3F47; }
  .totalTitle { font-size: 17px; font-weight: 700; }
  .grandTotal { margin-left: auto; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .empty { text-align: center; color: #B0B6BD; font-size: 15px; padding: 26px 0; }
  .totalList { display: flex; flex-direction: column; gap: 14px; margin-top: 12px; }
  .totalItemHead { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .miniDot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .totalItemLabel { font-size: 14px; font-weight: 600; color: #3A3F47; }
  .totalItemVal { margin-left: auto; font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .barTrack { height: 8px; border-radius: 6px; background: #F0F1F4; overflow: hidden; }
  .barFill { height: 100%; border-radius: 6px; transition: width .4s ease; }

  /* 記録詳細 */
  .logCard { background: #fff; border-radius: 18px; padding: 16px 12px; margin-bottom: 18px; }
  .logHead { font-size: 14px; font-weight: 700; color: #6B7280; padding: 0 4px 8px; }
  .logRowWrap { border-top: 1px solid #F2F3F5; }
  .logRow { display: flex; align-items: center; gap: 8px; padding: 9px 4px; }
  .logLabel { font-size: 13.5px; font-weight: 600; color: #3A3F47; flex-shrink: 0; }
  .logTime { font-size: 12.5px; color: #9AA1AA; margin-left: 4px; font-variant-numeric: tabular-nums; }
  .logDur { margin-left: auto; font-size: 13.5px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .delBtn { background: none; border: none; cursor: pointer; padding: 4px; display: flex; flex-shrink: 0; }
  .delBtn svg { width: 15px; height: 15px; color: #B8BEC6; }
  .memoShown { font-size: 13px; color: #6B7280; background: #F7F8FA; border-radius: 8px; padding: 6px 10px; margin: 0 4px 8px; }

  /* 書き出し */
  .exportBtn {
    width: 100%; background: #2A2E35; color: #fff; border: none; border-radius: 16px;
    padding: 17px; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;
  }
  .exportBtn svg { width: 19px; height: 19px; }
  .footNote { text-align: center; font-size: 12px; color: #A8AEB6; margin-top: 14px; line-height: 1.6; }
  /* ─── やること（ToDo） ─── */
  .stopZone { cursor:pointer; border-radius:12px; }
  .stopZone:active { background:rgba(255,255,255,.12); }
  .todoMini { margin-top:14px; padding:10px 4px 2px; border-top:1px solid rgba(0,0,0,.07); cursor:pointer; }
  .statusCard[style*="background:#"] .todoMini { border-top-color:rgba(255,255,255,.25); }
  .todoMiniGrid { display:grid; grid-template-columns:1fr 1fr; grid-auto-flow:column; grid-template-rows:1fr 1fr; gap:4px 12px; }
  .todoMiniItem { display:flex; align-items:center; gap:6px; font-size:13px; font-weight:600; text-align:left; padding:2px 4px; }
  .todoMiniDot { width:8px; height:8px; border-radius:50%; background:#B8BEC6; flex-shrink:0; }
  .todoMiniName { color:#5A6270; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .todoMiniEmpty { font-size:12px; color:#B8BEC6; text-align:left; padding:2px 4px; }
  .statusCard.running .todoMini { border-top-color:rgba(255,255,255,.3); }
  .statusCard.running .todoMiniName { color:#fff; }
  .statusCard.running .todoMiniEmpty { color:rgba(255,255,255,.85); }
  .statusCard.running .todoMiniDot { background:#fff; }
  .todoPanel { background:#fff; border-radius:18px; padding:16px; margin-bottom:14px; }
  .todoPanelHead { font-size:15px; font-weight:800; margin-bottom:12px; }
  .todoInputRow { display:flex; gap:8px; margin-bottom:10px; }
  .todoInput { flex:1; padding:12px 14px; font-size:15px; border-radius:12px; border:1.5px solid #E3E5E8; outline:none; }
  .todoInput:focus { border-color:#9AA1AA; }
  .todoAddBtn { background:#5F6874; color:#fff; border:none; border-radius:12px; padding:0 20px; font-size:22px; font-weight:700; cursor:pointer; }
  .suggestRow { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; max-height:180px; overflow-y:auto; }
  .suggestBtn { font-size:13px; font-weight:600; padding:9px 13px; border-radius:12px; border:1.5px solid #E3E5E8; background:#F7F8FA; color:#5A6270; cursor:pointer; display:flex; align-items:center; gap:5px; }
  .sdot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .catRow { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .catChip { font-size:12px; font-weight:700; padding:7px 12px; border-radius:10px; border:2px solid; background:#fff; cursor:pointer; opacity:.5; }
  .catChip.on { opacity:1; }
  .catPicker { display:flex; flex-wrap:wrap; gap:6px; padding:10px 12px 12px; margin:-6px 0 9px; background:#F7F8FA; border-radius:0 0 14px 14px; }
  .todoRow { margin-bottom:9px; }
  .todoItem { display:flex; align-items:center; gap:8px; padding:13px 11px; border-radius:14px; background:#F7F8FA; border:2px solid #E8EAED; }
  .todoRank { width:28px; height:28px; border-radius:50%; background:#B8BEC6; color:#fff; font-size:15px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer; }
  .todoMainCol { flex:1; text-align:left; }
  .todoText { font-size:15px; font-weight:700; color:#2A2E35; }
  .todoTag { display:inline-block; width:9px; height:9px; border-radius:50%; margin-left:6px; vertical-align:middle; }
  .todoAcc { font-size:11px; font-weight:700; color:#5F6874; margin-left:6px; }
  .todoStartBtn { background:#fff; color:#5A6270; border:2px solid #B8BEC6; border-radius:10px; padding:7px 12px; font-size:13px; font-weight:800; cursor:pointer; white-space:nowrap; }
  .todoArrow { background:none; border:none; color:#B8BEC6; cursor:pointer; font-size:20px; line-height:1; padding:2px 4px; }
  .todoDel { background:none; border:none; color:#C7CCD2; font-size:20px; font-weight:700; cursor:pointer; padding:2px 4px; line-height:1; }
  .todoEmpty { text-align:center; color:#B8BEC6; font-size:14px; padding:12px 0; }
  .doneItem { display:flex; align-items:center; padding:11px; border-radius:12px; background:#F7F8FA; margin-bottom:8px; opacity:.8; }
  .doneTime { font-size:11px; font-weight:700; color:#2E9E5B; margin-left:6px; }
</style>
</head>
<body>
<div id="root"></div>

<script>
// ─────────────────────────────────────────────
// 業務の定義
// ─────────────────────────────────────────────
const TASKS = [
  { id: "outlook", label: "Outlook＋マスター更新", short: "Outlook",  icon: "mail",     color: "#3B7DD8" },
  { id: "kaikake", label: "買掛金・リベート照合",   short: "買掛金",   icon: "file",     color: "#E85B9A" },
  { id: "hanbai",  label: "販売準備",             short: "販売準備", icon: "package",  color: "#8B5CD8" },
  { id: "urikake", label: "売掛金関連",           short: "売掛金",   icon: "receipt",  color: "#2E9E5B" },
  { id: "claude",  label: "Claude",              short: "Claude",  icon: "sparkles", color: "#E8863B" },
  { id: "taiou",   label: "対応（電話・来客）",     short: "対応",     icon: "phone",    color: "#A0603A" },
  { id: "kyukei",  label: "離席・休憩",           short: "離席",     icon: "coffee",   color: "#5F6874" },
  { id: "sonota",  label: "その他",               short: "その他",   icon: "settings", color: "#1E3A6B" },
];
const TASK_MAP = {};
TASKS.forEach(t => TASK_MAP[t.id] = t);
// 学習式メモ：業務ごとに、その業務で使ったメモが候補として溜まる（最近使った順）
let memoHistory = {};  // { taskId: ["三菱","ヤマザキ",...], ... }
const MEMO_LIMIT = 30; // 業務ごとの候補の最大表示数

// ─── やること（ToDo） ───
let todos = [];          // [{id, text, cat, acc}]
let done = [];           // 今日やりきった [{text, cat, time}]
let doneDate = "";       // やりきったの日付（変わったらリセット）
let learned = {};        // { "三菱食品の照合": "kaikake" } 学習式の分類
let todoHistory = [];    // よく使うやること候補（新しい順・最大30）
let todoSeq = 1;
const TODO_HIST_MAX = 30;
let todoPanelOpen = false, pickedCat = null, catPickerId = null;
let todoRunId = null;    // 実行中のやることID（業務ボタンとは排他）

// ─────────────────────────────────────────────
// アイコン（SVG・外部依存なし）
// ─────────────────────────────────────────────
const ICONS = {
  mail: '<path d="M22 6l-10 7L2 6"/><rect x="2" y="4" width="20" height="16" rx="2"/>',
  file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 15l2 2 4-4"/>',
  package: '<path d="M16.5 9.4L7.5 4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96L12 12.01l8.73-5.05"/><path d="M12 22.08V12"/>',
  receipt: '<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1z"/><path d="M8 7h8"/><path d="M8 11h8"/><path d="M12 15h4"/>',
  sparkles: '<path d="M12 1.5l2.5 7.3L22 11.5l-7.5 2.7L12 22l-2.5-7.8L2 11.5l7.5-2.7z"/><path d="M20 3v3.2M18.4 4.6h3.2" stroke-width="1.5"/><path d="M4.5 16.5v2.8M3.1 17.9h2.8" stroke-width="1.5"/>',
  phone: '<path d="M13 3a8 8 0 0 1 8 8"/><path d="M13 6.5a4.5 4.5 0 0 1 4.5 4.5"/><path d="M20 15.5v2.5a1.8 1.8 0 0 1-2 1.8 16.5 16.5 0 0 1-7.2-2.56 16.2 16.2 0 0 1-5-5A16.5 16.5 0 0 1 3.24 5a1.8 1.8 0 0 1 1.8-2h2.5a1.8 1.8 0 0 1 1.8 1.55 11.5 11.5 0 0 0 .6 2.4 1.8 1.8 0 0 1-.4 1.9l-1.05 1.05a14 14 0 0 0 5 5l1.05-1.05a1.8 1.8 0 0 1 1.9-.4 11.5 11.5 0 0 0 2.4.6A1.8 1.8 0 0 1 20 15.5z"/>',
  coffee: '<path d="M18 8h1.5a3 3 0 0 1 0 6H18"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4z"/><line x1="6" y1="2" x2="6" y2="5"/><line x1="10" y1="2" x2="10" y2="5"/><line x1="14" y1="2" x2="14" y2="5"/>',
  settings: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  play: '<polygon points="5 3 19 12 5 21 5 3"/>',
  bar: '<line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
  left: '<polyline points="15 18 9 12 15 6"/>',
  right: '<polyline points="9 18 15 12 9 6"/>',
  calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
  trash: '<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
};
function icon(name, color) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="' + (color || 'currentColor') +
    '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ICONS[name] + '</svg>';
}

// ─────────────────────────────────────────────
// IndexedDB
// ─────────────────────────────────────────────
const DB_NAME = "work-tracker-db", STORE = "sessions", TODO_STORE = "todos";
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 2);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE)) {
        const os = db.createObjectStore(STORE, { keyPath: "id" });
        os.createIndex("dateKey", "dateKey", { unique: false });
      }
      if (!db.objectStoreNames.contains(TODO_STORE)) {
        db.createObjectStore(TODO_STORE, { keyPath: "key" });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
// ToDo関連の保存・読み込み（key固定で1レコードにまとめて保存）
async function todoSave() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(TODO_STORE, "readwrite");
    tx.objectStore(TODO_STORE).put({
      key: "state",
      todos: todos,
      done: done,
      doneDate: doneDate,
      learned: learned,
      history: todoHistory,
      seq: todoSeq
    });
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function todoLoad() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const req = db.transaction(TODO_STORE, "readonly").objectStore(TODO_STORE).get("state");
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function dbGetAll() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const req = db.transaction(STORE, "readonly").objectStore(STORE).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
async function dbPut(s) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).put(s);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function dbDelete(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
// 全記録を削除
async function dbClearAll() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).clear();
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

// ─────────────────────────────────────────────
// 日付・時間ユーティリティ
// ─────────────────────────────────────────────
const WD = ["日","月","火","水","木","金","土"];
const dateKeyOf = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const fmtHeader = d => (d.getMonth()+1) + "月" + d.getDate() + "日(" + WD[d.getDay()] + ")";
const fmtClock = ms => { const d = new Date(ms); return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); };
function fmtDur(ms) {
  const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  if (h>0) return h + "時間" + String(m).padStart(2,"0") + "分";
  if (m>0) return m + "分" + String(sec).padStart(2,"0") + "秒";
  return sec + "秒";
}
function fmtDurClock(ms) {
  const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0") + ":" + String(sec).padStart(2,"0");
}

// ─────────────────────────────────────────────
// アプリ状態
// ─────────────────────────────────────────────
const state = {
  sessions: [],      // 終了済み
  active: null,      // 稼働中
  viewDate: new Date(),
  now: Date.now(),
  memoOpen: false,   // 記録中カードのメモ欄が開いてるか
};
let tick = null;

async function boot() {
  const all = await dbGetAll();
  state.active = all.find(s => s.end == null) || null;
  state.sessions = all.filter(s => s.end != null);
  rebuildMemoHistory(all);
  // やることの読み込み
  try {
    const td = await todoLoad();
    if (td) {
      todos = td.todos || [];
      done = td.done || [];
      doneDate = td.doneDate || "";
      learned = td.learned || {};
      todoHistory = td.history || [];
      todoSeq = td.seq || 1;
    }
  } catch(e) { /* 初回は何もない */ }
  todoCheckDoneDate();
  startTick();
  render();
}
// 全記録から業務ごとのメモ候補を組み立てる（最近使った順・重複なし）
function rebuildMemoHistory(all) {
  const map = {};
  // 新しい記録順に見て、業務ごとに初出のメモを拾う
  [...all].sort((a, b) => b.start - a.start).forEach(s => {
    const m = (s.memo || "").trim();
    if (!m) return;
    if (!map[s.taskId]) map[s.taskId] = [];
    if (!map[s.taskId].includes(m)) map[s.taskId].push(m);
  });
  // 各業務、上限まで
  Object.keys(map).forEach(k => { map[k] = map[k].slice(0, MEMO_LIMIT); });
  memoHistory = map;
}
// メモを候補の先頭へ（その業務の候補として、最近使った順で上に来る）
function pushMemoHistory(taskId, memo) {
  const m = (memo || "").trim();
  if (!m) return;
  const cur = memoHistory[taskId] || [];
  memoHistory[taskId] = [m, ...cur.filter(x => x !== m)].slice(0, MEMO_LIMIT);
}
function startTick() {
  if (tick) clearInterval(tick);
  if (state.active) tick = setInterval(() => { state.now = Date.now(); updateTimer(); }, 1000);
}

// 業務ボタン
async function handleTask(taskId) {
  const ts = Date.now();
  if (state.active) {
    const finished = Object.assign({}, state.active, { end: ts });
    await dbPut(finished);
    state.sessions.push(finished);
    // やることが動いてたら、途中まで記録して残す
    if (todoRunId !== null) {
      const t = todos.find(x => x.id === todoRunId);
      if (t) t.acc += (ts - state.active.start);
      todoRunId = null;
      await todoSave();
    }
    if (state.active.taskId === taskId) { state.active = null; state.memoOpen = false; startTick(); render(); return; }
  }
  const fresh = { id: ts + "-" + Math.random().toString(36).slice(2,8), taskId, start: ts, end: null, dateKey: dateKeyOf(new Date(ts)), memo: "" };
  await dbPut(fresh);
  state.active = fresh;
  state.now = ts;
  state.memoOpen = false;
  startTick();
  render();
}

// やること（ToDo）
// ─────────────────────────────────────────────
function todoTogglePanel(){ todoPanelOpen = !todoPanelOpen; catPickerId = null; render(); }
function todoOpenInput(){ document.getElementById("todoSuggest").style.display="flex"; document.getElementById("todoCats").style.display="flex"; todoRenderSuggest(); }
function todoCloseInput(){ const s=document.getElementById("todoSuggest"), c=document.getElementById("todoCats"); if(s)s.style.display="none"; if(c)c.style.display="none"; }
function todoPickCat(id){
  const inp = document.getElementById("todoInput");
  const keep = inp ? inp.value : "";
  pickedCat = (pickedCat===id?null:id);
  render();
  const inp2 = document.getElementById("todoInput");
  if (inp2) { inp2.value = keep; }
  todoOpenInput();
}
function todoPushHistory(text){
  todoHistory = todoHistory.filter(t => t !== text);
  todoHistory.unshift(text);
  if (todoHistory.length > TODO_HIST_MAX) todoHistory = todoHistory.slice(0, TODO_HIST_MAX);
}
async function todoAdd(){
  const inp = document.getElementById("todoInput");
  const t = (inp.value || "").trim();
  if (!t) return;
  todos.push({ id: todoSeq++, text: t, cat: pickedCat, acc: 0 });
  if (pickedCat) learned[t] = pickedCat;
  todoPushHistory(t);
  inp.value = ""; pickedCat = null;
  await todoSave();
  todoCloseInput(); inp.blur(); render();
}
async function todoPickSuggest(text){
  const cat = learned[text] || null;
  todos.push({ id: todoSeq++, text: text, cat: cat, acc: 0 });
  todoPushHistory(text);
  const inp = document.getElementById("todoInput"); if(inp) inp.value = "";
  pickedCat = null;
  await todoSave();
  todoCloseInput(); render();
}
async function todoMoveUp(id){
  const i = todos.findIndex(x => x.id === id);
  if (i <= 0) return;
  [todos[i-1], todos[i]] = [todos[i], todos[i-1]];
  await todoSave(); render();
}
async function todoDelete(id){
  if (todoRunId === id) await todoStopCurrent();
  todos = todos.filter(x => x.id !== id);
  await todoSave(); render();
}
function todoOpenCatPicker(id){ catPickerId = (catPickerId===id ? null : id); render(); }
async function todoSetCat(id, catId){
  const t = todos.find(x => x.id === id); if (!t) return;
  t.cat = (t.cat === catId ? null : catId);
  if (t.cat) learned[t.text] = t.cat; else delete learned[t.text];
  catPickerId = null;
  await todoSave(); render();
}
// やることを開始／終了（同じの押したら完了）
async function todoPress(id){
  const ts = Date.now();
  const t = todos.find(x => x.id === id); if (!t) return;
  // 同じやることが動いてる → 完了（10秒以内なら記録せず削除）
  if (todoRunId === id && state.active) {
    const elapsed = ts - state.active.start;
    if (elapsed < 10000) {
      // 10秒以内＝取り消し扱い。記録を消してリストからも削除
      await dbDelete(state.active.id);
      todos = todos.filter(x => x.id !== id);
      state.active = null; todoRunId = null; state.memoOpen = false;
      await todoSave(); startTick(); render(); return;
    }
    const finished = Object.assign({}, state.active, { end: ts });
    await dbPut(finished);
    state.sessions.push(finished);
    const total = t.acc + elapsed;
    todoCheckDoneDate();
    done.unshift({ text: t.text, cat: t.cat, time: total });
    todos = todos.filter(x => x.id !== id);
    state.active = null; todoRunId = null; state.memoOpen = false;
    await todoSave(); startTick(); render(); return;
  }
  // 別のが動いてたら止める（やることなら途中保存で残す）
  if (state.active) {
    const finished = Object.assign({}, state.active, { end: ts });
    await dbPut(finished);
    state.sessions.push(finished);
    if (todoRunId !== null) {
      const prev = todos.find(x => x.id === todoRunId);
      if (prev) prev.acc += (ts - state.active.start);
    }
  }
  // 開始：分類があればその業務ID、なければ「その他」で記録。メモにやること名
  const taskId = t.cat || "sonota";
  const fresh = { id: ts + "-" + Math.random().toString(36).slice(2,8), taskId, start: ts, end: null, dateKey: dateKeyOf(new Date(ts)), memo: t.text };
  await dbPut(fresh);
  state.active = fresh; state.now = ts; todoRunId = id; state.memoOpen = false;
  pushMemoHistory(taskId, t.text);
  await todoSave(); startTick(); render();
}
// 記録中カードを押して「止める」（完了ではない・リストに残る）
async function todoStopCurrent(){
  if (!state.active) return;
  const ts = Date.now();
  const finished = Object.assign({}, state.active, { end: ts });
  await dbPut(finished);
  state.sessions.push(finished);
  if (todoRunId !== null) {
    const t = todos.find(x => x.id === todoRunId);
    if (t) t.acc += (ts - state.active.start);
  }
  state.active = null; todoRunId = null; state.memoOpen = false;
  await todoSave(); startTick(); render();
}
// 日付が変わったら「今日やりきった」をリセット
function todoCheckDoneDate(){
  const today = dateKeyOf(new Date());
  if (doneDate !== today) { done = []; doneDate = today; }
}
function todoRenderSuggest(){
  const row = document.getElementById("todoSuggest"); if (!row) return;
  const inp = document.getElementById("todoInput");
  const v = inp ? (inp.value||"").trim() : "";
  const active = todos.map(t => t.text);
  let cands = todoHistory.filter(t => !active.includes(t));
  if (v) cands = cands.filter(t => t.includes(v));
  cands = cands.slice(0, TODO_HIST_MAX);
  if (cands.length === 0) { row.innerHTML = ""; return; }
  row.innerHTML = cands.map(t => {
    const c = learned[t] ? TASK_MAP[learned[t]] : null;
    const dot = c ? '<span class="sdot" style="background:'+c.color+'"></span>' : '';
    return '<button class="suggestBtn" onclick="todoPickSuggest(\''+t.replace(/'/g,"\\'")+'\')">'+dot+esc(t)+'</button>';
  }).join("");
}
function todoOnType(){
  const inp = document.getElementById("todoInput");
  const v = (inp.value||"").trim();
  if (learned[v] && pickedCat === null) { pickedCat = learned[v]; }
  todoRenderSuggest();
}

async function handleActiveMemo(memo) {
  if (!state.active) return;
  state.active.memo = memo;
  await dbPut(state.active);
}
async function handleDelete(id) {
  await dbDelete(id);
  state.sessions = state.sessions.filter(s => s.id !== id);
  render();
}
// 全記録リセット（確認つき）
async function handleClearAll() {
  if (!confirm("これまでの記録をすべて消します。よろしいですか？（元に戻せません）")) return;
  await dbClearAll();
  state.sessions = [];
  state.active = null;
  memoHistory = {};
  state.memoOpen = false;
  startTick();
  render();
}
function shiftDate(delta) {
  const d = new Date(state.viewDate);
  d.setDate(d.getDate() + delta);
  state.viewDate = d;
  render();
}

// 書き出し
function handleExport() {
  const rows = [["日付","業務","開始","終了","経過(秒)","経過(表示)","メモ"]];
  state.sessions.slice().sort((a,b)=>a.start-b.start).forEach(s => {
    rows.push([s.dateKey, (TASK_MAP[s.taskId]||{}).label || s.taskId, fmtClock(s.start), fmtClock(s.end),
      Math.round((s.end-s.start)/1000), fmtDurClock(s.end-s.start), s.memo || ""]);
  });
  const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g,'""') + '"').join(",")).join("\r\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "業務記録_" + dateKeyOf(new Date()) + ".csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// タイマーだけ軽く更新（毎秒フル再描画を避ける）
function updateTimer() {
  if (!state.active) return;
  const el = document.getElementById("statusTimer");
  if (el) el.textContent = fmtDur(state.now - state.active.start);
  // 稼働中の記録詳細の経過も更新
  const rt = document.getElementById("runningDur");
  if (rt) rt.textContent = fmtDur(state.now - state.active.start);
}

// ─────────────────────────────────────────────
// 描画
// ─────────────────────────────────────────────
function render() {
  const todayKey = dateKeyOf(new Date());
  const viewKey = dateKeyOf(state.viewDate);
  const isToday = viewKey === todayKey;
  const activeTask = state.active ? TASK_MAP[state.active.taskId] : null;

  const dayRecords = state.sessions.filter(s => s.dateKey === viewKey).sort((a,b)=>a.start-b.start);
  const activeOnView = (state.active && dateKeyOf(new Date(state.active.start)) === viewKey) ? state.active : null;

  const totals = {};
  dayRecords.forEach(s => { totals[s.taskId] = (totals[s.taskId]||0) + (s.end - s.start); });
  if (activeOnView) totals[activeOnView.taskId] = (totals[activeOnView.taskId]||0) + (state.now - activeOnView.start);
  const totalOrder = TASKS.filter(t => totals[t.id] > 0);
  const grandTotal = Object.values(totals).reduce((a,b)=>a+b,0);

  let html = '<div class="container">';
  html += '<div class="appHeader">業務記録</div>';

  // 記録中カード
  if (activeTask) {
    html += '<div class="statusCard running" style="border-color:' + activeTask.color + ';background:' + (activeTask.gradient || activeTask.color) + '">';
    html += '<div class="stopZone" onclick="todoStopCurrent()">';
    html += '<div class="statusNowLabel">いま記録中</div>';

    html += '</div>';

      html += '<div class="activeMemoBox">';

        html += '<div class="memoQuickRow">';

          const on = state.active.memo === m ? ' on' : '';

      html += '<button class="activeMemoClear" onclick="clearMemo()">消す</button>';

    html += '</div>';

  html += todoPanelHtml();

  }
}

  const tsh = "";
  return '<button class="taskBtn' + (small ? ' small' : '') + '" style="border-color:' + t.color + ';background:' + bg + ';box-shadow:' + shadow + '" onclick="handleTask(\'' + t.id + '\')">' +
    icon(t.icon, fg) + '<span class="taskLabel" style="color:' + fg + tsh + '">' + esc(t.label) + '</span></button>';
}

function logRow(task, start, end, running, memo, id) {
  let h = '<div class="logRowWrap"><div class="logRow">';
  h += '<span class="miniDot" style="background:' + task.color + '"></span>';
  h += '<span class="logLabel">' + esc(task.label) + '</span>';
  h += '<span class="logTime">' + fmtClock(start) + (running ? ' 〜 稼働中' : ' 〜 ' + fmtClock(end)) + '</span>';
  h += '<span class="logDur"' + (running ? ' id="runningDur"' : '') + ' style="color:' + task.color + '">' + fmtDur(end - start) + '</span>';
  if (id) h += '<button class="delBtn" onclick="handleDelete(\'' + id + '\')">' + icon("trash") + '</button>';
  h += '</div>';
  if (memo) h += '<div class="memoShown">📝 ' + esc(memo) + '</div>';
  h += '</div>';
  return h;
}

// メモ操作
function openMemo(){ state.memoOpen = true; render(); }
function closeMemo(){
  if (state.active) {
    handleActiveMemo(state.active.memo);
    pushMemoHistory(state.active.taskId, state.active.memo);
  }
  state.memoOpen = false;
  render();
}
function quickMemo(m){ if (!state.active) return; state.active.memo = (state.active.memo === m ? "" : m); handleActiveMemo(state.active.memo); render(); }
function typeMemo(v){ if (!state.active) return; state.active.memo = v; handleActiveMemo(v); }
function clearMemo(){ if (!state.active) return; state.active.memo = ""; handleActiveMemo(""); render(); }

// 起動
boot();
</script>
</body>
</html>
